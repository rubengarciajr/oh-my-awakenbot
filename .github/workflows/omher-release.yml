name: AWAKEN BOT release

# A tag produces a draft. Publishing and changing the live update pointer are explicit actions.
on:
  push:
    tags: ['awakenbot-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing awakenbot-vX.Y.Z tag
        required: true
        type: string
      publish:
        description: Publish this release and notify installed AWAKEN BOT clients
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: awaken-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Validate immutable release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v=$(node -p "require('./apps/omher/src-tauri/tauri.conf.json').version")
          test "$TAG" = "awakenbot-v$v"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    needs: validate
    uses: ./.github/workflows/awaken-bot-build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit
  release:
    if: always() && needs.validate.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.publish))
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLISH: ${{ inputs.publish || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PUBLISH != 'true'
        with:
          pattern: awaken-bot-*
          path: dist
          merge-multiple: true
      - name: Write signed update manifest and checksums
        if: env.PUBLISH != 'true'
        run: |
          node apps/omher/scripts/release-manifest.mjs dist "$GH_REPO" "$TAG"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - name: Create reviewable draft release
        if: env.PUBLISH != 'true'
        run: |
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'Published releases are immutable.' >&2; exit 1; }
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --draft --title "AWAKEN BOT ${TAG#awakenbot-v}" --notes-file apps/omher/RELEASE-NOTES.md
          fi
      - name: Publish and promote the live updater
        if: env.PUBLISH == 'true'
        run: |
          # Promote exactly the reviewed files, with no rebuild or asset replacement.
          gh release download "$TAG" --dir dist
          (cd dist && sha256sum --check SHA256SUMS.txt)
          node apps/omher/scripts/release-manifest.mjs dist "$GH_REPO" "$TAG" --verify
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
          # A retry after a pointer-upload failure can safely finish promotion of a public release.
          if gh release view awakenbot-latest >/dev/null 2>&1; then
            gh release upload awakenbot-latest dist/latest.json --clobber
          else
            gh release create awakenbot-latest dist/latest.json --target "$TAG" --prerelease --latest=false --title 'AWAKEN BOT update feed' --notes 'Signed update manifest for AWAKEN BOT. Download installers from versioned releases.'
          fi

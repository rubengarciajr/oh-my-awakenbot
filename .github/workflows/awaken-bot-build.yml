name: AWAKEN BOT installers

on:
  push:
    branches: [main, feature/awaken-bot-desktop]
    paths:
      - 'apps/omher/**'
      - 'brand/**'
      - '.github/workflows/awaken-bot-build.yml'
      - '.github/workflows/omher-release.yml'
  pull_request:
    paths:
      - 'apps/omher/**'
      - 'brand/**'
      - '.github/workflows/awaken-bot-build.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: awaken-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            label: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/omher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pnpm and Rust target
        run: |
          npm install --global pnpm@11
          rustup target add ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and verify brand assets
        run: |
          pnpm typecheck
          node scripts/brand-assets.mjs --check
          node --test scripts/brand-assets.test.mjs scripts/release-manifest.test.mjs
      - name: Unit tests
        if: matrix.label == 'macos-arm64'
        run: pnpm test
      - name: Browser tests for launch, branding and appearance
        if: matrix.label == 'macos-arm64'
        run: |
          pnpm exec playwright install chromium
          pnpm exec playwright test awaken-brand.spec.ts appearance.spec.ts --reporter=line
      - name: Rust tests
        if: matrix.label != 'macos-x64'
        working-directory: apps/omher/src-tauri
        run: cargo test --locked
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            # Pull requests from forks have no signing secret; still verify real installers build.
            pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Collect installers and updater bundles
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out="$RUNNER_TEMP/awaken-out"
          mkdir -p "$out"
          b="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ runner.os }}" = macOS ]; then
            cp "$b"/dmg/*.dmg "$out/awaken-bot-$v-${{ matrix.label }}.dmg"
            test -f "$b/macos/Awaken Bot.app/Contents/Resources/bridge/omher_bridge.py"
            codesign --verify --deep --strict "$b/macos/Awaken Bot.app"
            for f in "$b"/macos/*.app.tar.gz; do
              [ -f "$f" ] || continue
              cp "$f" "$out/awaken-bot-$v-${{ matrix.label }}.app.tar.gz"
              cp "$f.sig" "$out/awaken-bot-$v-${{ matrix.label }}.app.tar.gz.sig"
            done
          else
            cp "$b"/nsis/*.exe "$out/awaken-bot-$v-windows-x64-setup.exe"
            cp "$b"/msi/*.msi "$out/awaken-bot-$v-windows-x64.msi"
            for f in "$b"/nsis/*.exe.sig; do
              [ -f "$f" ] || continue
              cp "$f" "$out/awaken-bot-$v-windows-x64-setup.exe.sig"
            done
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awaken-bot-${{ matrix.label }}
          path: ${{ runner.temp }}/awaken-out/*
          if-no-files-found: error
          retention-days: 30

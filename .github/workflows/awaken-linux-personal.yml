name: Awaken Bot personal Linux build

# This branch is an explicit one-off build. The normal Mac/Windows matrix is unchanged.
on:
  push:
    branches: [build/awaken-linux-personal]
    paths: ['.github/workflows/awaken-linux-personal.yml', 'apps/omher/scripts/awaken-linux-smoke.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awaken-linux-personal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev file xvfb xdotool
          npm install --global pnpm@11
          python -m pip install 'websockets>=14' pyyaml
      - name: Verify UI and bridge
        working-directory: apps/omher
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          node scripts/brand-assets.mjs --check
          pnpm test
          python -m unittest discover -s bridge/tests
      - name: Verify native shell
        working-directory: apps/omher/src-tauri
        run: cargo test --locked
      - name: Build release AppImage and Debian package
        working-directory: apps/omher
        run: pnpm tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Smoke-test the packaged app
        timeout-minutes: 3
        run: bash apps/omher/scripts/awaken-linux-smoke.sh apps/omher/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Collect personal installers and provenance
        working-directory: apps/omher
        run: |
          out="$RUNNER_TEMP/awaken-linux"
          mkdir -p "$out"
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/awaken-bot-$v-linux-x64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "$out/awaken-bot-$v-linux-x64.deb"
          git rev-parse HEAD > "$out/SOURCE-COMMIT.txt"
          (cd "$out" && sha256sum *.AppImage *.deb SOURCE-COMMIT.txt > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awaken-bot-linux-x64-personal
          path: ${{ runner.temp }}/awaken-linux/*
          if-no-files-found: error
          retention-days: 30
